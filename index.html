<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Jiu Presença</title>
<style>
  :root{
    --blue:#2563eb; --blue-dark:#1d4ed8; --green:#16a34a; --red:#dc2626;
    --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --text2:#64748b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#f8fafc,#eff6ff);color:var(--text);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:128px;position:relative;}
  .px{padding-left:16px;padding-right:16px;}
  h1{font-size:22px;font-weight:700;margin:0;}
  h2{font-size:16px;font-weight:600;margin:0 0 10px;}
  .sub{color:var(--text2);font-size:13px;margin:2px 0 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  select,input[type=text],input[type=number],input[type=date]{
    width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 10px;font-size:14px;background:#fff;color:var(--text);
  }
  label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  button{font-family:inherit;cursor:pointer;}
  .btn{border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;background:#eef2f7;color:var(--text);}
  .btn-block{width:100%;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--border);}
  .btn-icon{width:36px;height:36px;border-radius:9px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0;font-size:16px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e2e8f0;color:#334155;}
  .badge-green{background:#dcfce7;color:#166534;}
  .badge-blue{background:#dbeafe;color:#1e40af;}
  .badge-yellow{background:#fef9c3;color:#854d0e;}
  header.top{position:sticky;top:0;background:rgba(248,250,252,.92);backdrop-filter:blur(6px);z-index:5;padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  nav.tabs{
    position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:calc(100% - 28px);max-width:452px;
    background:rgba(255,255,255,.68);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);border-radius:20px;
    box-shadow:0 12px 32px rgba(15,23,42,.16),0 2px 6px rgba(15,23,42,.06);
    display:flex;align-items:center;justify-content:space-between;
    padding:6px;gap:2px;z-index:30;
  }
  nav.tabs button{
    flex:1;background:none;border:none;padding:7px 2px 6px;color:var(--text2);
    display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;
    transition:background .15s ease,color .15s ease,transform .1s ease;
  }
  nav.tabs button svg{width:21px;height:21px;display:block;}
  nav.tabs button span{font-size:10px;font-weight:600;letter-spacing:.1px;}
  nav.tabs button.active{color:var(--blue);background:rgba(37,99,235,.12);}
  nav.tabs button:active{transform:scale(.92);}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#4338ca);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .faixa{height:12px;width:96px;border-radius:3px;position:relative;overflow:hidden;border:1px solid #cbd5e1;flex-shrink:0;}
  .faixa .stripe{position:absolute;left:0;right:0;height:3px;top:4.5px;}
  .faixa .tip{position:absolute;right:0;top:0;bottom:0;width:26px;background:#0f172a;display:flex;align-items:center;justify-content:center;gap:1px;padding:0 2px;}
  .faixa .grau{width:2px;height:8px;border-radius:1px;background:transparent;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:#fff;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:28px 0;}
  .stat{background:#f8fafc;border-radius:12px;padding:12px;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--text2);}
  .list-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:#fff;}
  .promo-item{padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;}
  .flexwrap{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:16px;z-index:20;background:#0f172a;color:#fff;border:none;border-radius:999px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(15,23,42,.28);}
  .textbtn{background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;padding:0;}
  .divider{height:1px;background:var(--border);margin:10px 0;}
  .note{font-size:12px;color:var(--text2);}
</style>
</head>

function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(s){ if(!s) return ''; const d = parseISO(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function startOfWeek(d){ const r = new Date(d); r.setDate(r.getDate()-r.getDay()); r.setHours(0,0,0,0); return r; }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function todayStr(){ return fmtISO(new Date()); }
function calcIdade(dataNasc){
  const hoje = new Date(); const n = parseISO(dataNasc);
  let idade = hoje.getFullYear()-n.getFullYear();
  const m = hoje.getMonth()-n.getMonth();
  if(m<0 || (m===0 && hoje.getDate()<n.getDate())) idade--;
  return idade;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ==== Sincronização na nuvem (JSONBin.io) ====
// 1) Crie uma conta grátis em jsonbin.io
// 2) Crie um bin novo (pode deixar com {})
// 3) Pegue a X-Master-Key (em "API Keys" no seu perfil) e o Bin ID (na URL do bin)
// 4) Cole os dois valores abaixo, entre as aspas
const JSONBIN_API_KEY = '$2a$10$jJJkxiXNrGR5mNa071nwyudobpBEpb1MXAtHcG8lQGK7/u/.yQ6pe';
const JSONBIN_BIN_ID = '6a641048f5f4af5e29bdfff5';
const JSONBIN_READ_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`;
const JSONBIN_WRITE_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

let ultimaLeituraDaNuvemOk = false;
async function storageGet(key){
  try{
    const res = await fetch(JSONBIN_READ_URL, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
    if(!res.ok) throw new Error('Não foi possível buscar os dados na nuvem (status '+res.status+')');
    const json = await res.json();
    const value = (json.record && Object.keys(json.record).length) ? JSON.stringify(json.record) : null;
    if(value) localStorage.setItem('jiu-presenca-cache-'+key, value);
    ultimaLeituraDaNuvemOk = true;
    return value;
  }catch(e){
    console.error('Sem conexão com a nuvem, usando última cópia salva neste aparelho', e);
    ultimaLeituraDaNuvemOk = false;
    return localStorage.getItem('jiu-presenca-cache-'+key);
  }
}
let dbSnapshotPendente = null;
async function storageSet(key, value){
  localStorage.setItem('jiu-presenca-cache-'+key, value);
  try{
    const res = await fetch(JSONBIN_WRITE_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY, 'X-Bin-Versioning': 'false' },
      body: value
    });
    if(!res.ok) throw new Error('status '+res.status);
    return true;
  }catch(e){
    console.error('Não consegui salvar na nuvem agora (ficou guardado só neste aparelho por enquanto)', e);
    return false;
  }
}
function saveDB(){
  dbSnapshotPendente = JSON.stringify(DB);
  state.syncStatus = 'saving';
  return enviarParaNuvem(dbSnapshotPendente);
}
async function enviarParaNuvem(snapshot){
  render();
  const ok = await storageSet('data', snapshot);
  state.syncStatus = ok ? 'ok' : 'error';
  render();
  return ok;
}
function reenviarParaNuvem(){
  const snapshot = dbSnapshotPendente || JSON.stringify(DB);
  state.syncStatus = 'saving';
  enviarParaNuvem(snapshot);
}


async function loadDB(){
  const raw = await storageGet('data');
  if(raw){
    DB = JSON.parse(raw);
    state.syncStatus = ultimaLeituraDaNuvemOk ? 'ok' : 'error';
  } else {
    DB = {
      alunos: SEED_ALUNOS.map(a=>({...a})),
      presencas: SEED_PRESENCAS.map(p=>({...p})),
      promocoes: [],
      nextAlunoId: Math.max(0,...SEED_ALUNOS.map(a=>a.id),0)+1,
      nextPresencaId: Math.max(0,...SEED_PRESENCAS.map(p=>p.id),0)+1,
      nextPromocaoId: 1,
    };
    await saveDB();
  }
}

function totalPresencasDe(alunoId){
  return DB.presencas.filter(p=>p.aluno_id===alunoId).length;
}
function progressoAluno(aluno){
  const total = totalPresencasDe(aluno.id);
  const ultimaPromo = aluno.presencas_na_ultima_promocao||0;
  const desdeUltimo = Math.max(0, total-ultimaPromo);
  const maxGraus = aluno.graus>=4 && aluno.graus_vermelhos>=4;
  const podePromoverGrau = !maxGraus && desdeUltimo>=AULAS_POR_GRAU;
  const aulasParaProximo = maxGraus?0:Math.max(0,AULAS_POR_GRAU-desdeUltimo);
  return {total, desdeUltimo, maxGraus, podePromoverGrau, aulasParaProximo};
}

function promoverGrau(id){
  const aluno = DB.alunos.find(a=>a.id===id); if(!aluno) return;
  let ng=aluno.graus, ngv=aluno.graus_vermelhos;
  if(ng<4) ng++; else if(ngv<4) ngv++; else { alert('Este aluno já tem o máximo de graus. Use "Graduar" para trocar de faixa.'); return; }
  const total = totalPresencasDe(id);
  DB.promocoes.push({id: DB.nextPromocaoId++, aluno_id:id, tipo:'grau', graduacao_anterior:aluno.graduacao, graus_anteriores:aluno.graus, graus_vermelhos_anteriores:aluno.graus_vermelhos, graduacao_nova:aluno.graduacao, graus_novos:ng, graus_vermelhos_novos:ngv, data_promocao:new Date().toISOString()});
  aluno.graus=ng; aluno.graus_vermelhos=ngv; aluno.presencas_na_ultima_promocao=total; aluno.updated_at=new Date().toISOString();
  saveDB(); render();
}
function graduarAluno(id){
  const aluno = DB.alunos.find(a=>a.id===id); if(!aluno) return;
  if(aluno.graus!==4 || aluno.graus_vermelhos!==4){ alert('O aluno ainda não atingiu o máximo de graus (4 brancos + 4 vermelhos).'); return; }
  const idx = FAIXAS.indexOf(aluno.graduacao);
  if(idx===-1){ alert('Graduação atual não reconhecida.'); return; }
  if(idx===FAIXAS.length-1){ alert('Este aluno já está na faixa máxima (preta).'); return; }
  const nova = FAIXAS[idx+1];
  const total = totalPresencasDe(id);
  DB.promocoes.push({id: DB.nextPromocaoId++, aluno_id:id, tipo:'graduacao', graduacao_anterior:aluno.graduacao, graus_anteriores:4, graus_vermelhos_anteriores:4, graduacao_nova:nova, graus_novos:0, graus_vermelhos_novos:0, data_promocao:new Date().toISOString()});
  aluno.graduacao=nova; aluno.graus=0; aluno.graus_vermelhos=0; aluno.presencas_na_ultima_promocao=total; aluno.updated_at=new Date().toISOString();
  saveDB(); render();
}
function excluirAluno(id){
  if(!confirm('Tem certeza que deseja excluir este aluno? Isso também remove as presenças dele.')) return;
  DB.alunos = DB.alunos.filter(a=>a.id!==id);
  DB.presencas = DB.presencas.filter(p=>p.aluno_id!==id);
  saveDB(); render();
}

function setTab(t){ state.tab=t; state.modal=null; render(); }
function faixaHTML(graduacao, graus, graus_vermelhos, size){
  const c = CORES[graduacao] || CORES['branca'];
  const h = size==='sm' ? 12 : 16;
  const w = size==='sm' ? 88 : 128;
  let inner = `<div class="faixa" style="height:${h}px;width:${w}px;background:${c.bg};${c.border?('border:'+c.border+';'):''}">`;
  if(c.stripe){ inner += `<div class="stripe" style="background:${c.stripe};top:${h/2-1.5}px;"></div>`; }
  inner += `<div class="tip">`;
  for(let i=0;i<4;i++){
    let col='transparent';
    if(i<graus) col='#fff';
    if(i<graus_vermelhos) col='#ef4444';
    inner += `<div class="grau" style="background:${col};"></div>`;
  }
  inner += `</div></div>`;
  return inner;
}

function renderTab(){

  return '';
}

function renderDashboard(){
  const academias = getAcademias();
  const base = addDays(new Date(), state.dashWeekOffset*7);

  const presSemana = DB.presencas.filter(p=> alunoIds.has(p.aluno_id) && p.data>=inicioStr && p.data<=fimStr);
  const ativos = new Set(presSemana.map(p=>p.aluno_id)).size;
  const totalAlunos = alunosF.length;
  const taxa = totalAlunos>0 ? Math.round((ativos/totalAlunos)*100) : 0;

  const prontos = DB.alunos.filter(a=> (state.dashAcademia==='todas'||a.academia===state.dashAcademia) && progressoAluno(a).podePromoverGrau);

  return `

    <div class="between" style="margin-bottom:10px;">

        <div style="font-weight:600;font-size:13px;">${fmtBR(inicioStr)} a ${fmtBR(fimStr)}</div>
        <div class="note">${state.dashWeekOffset===0?'Semana atual':(state.dashWeekOffset>0?'Semana futura':'Semana passada')}</div>
      </div>
      <button class="btn-icon" onclick="state.dashWeekOffset++; render();">&#8250;</button>

      <div class="stat"><div class="n">${totalAlunos}</div><div class="l">Total de alunos</div></div>
      <div class="stat"><div class="n">${presSemana.length}</div><div class="l">Presenças na semana</div></div>

    </div>
    <div class="grid2">
      ${dias.map(({d,n})=>{
        const ds = fmtISO(d);

        </button>`;
      }).join('')}
    </div>
  </div>
  <div class="card">
    <div class="between" style="margin-bottom:8px;">
      <h2 style="margin:0;">Alunos</h2>
      <span class="note">${fmtBR(state.presDateStr)} - ${horario}</span>
    </div>
    ${alunosF.length===0?`<div class="empty">Nenhum aluno nesta academia.</div>`:alunosF.map(a=>{
      const marcado = state.presPendentes.has(a.id);
      return `<div class="list-item" style="cursor:pointer;${marcado?'background:#f0fdf4;border-color:#86efac;':''}" onclick="togglePendente(${a.id})">

          <div style="font-weight:600;font-size:14px;">${escapeHtml(a.nome)}</div>
          ${faixaHTML(a.graduacao,a.graus,a.graus_vermelhos,'sm')}
        </div>
        <div class="badge ${marcado?'badge-green':''}">${marcado?'presente':'ausente'}</div>
      </div>`;
    }).join('')}
  </div>
  ${alunosF.length>0?`<button class="fab" onclick="confirmarPresencas()">Salvar (${state.presPendentes.size})</button>`:''}
  `;
}
function togglePendente(id){
  if(state.presPendentes.has(id)) state.presPendentes.delete(id); else state.presPendentes.add(id);
  render();
}
function confirmarPresencas(){
  const isVilla = state.presAcademia==='VillaFight';
  const horario = isVilla?'18:30':'18:45';
  const dataStr = state.presDateStr;
  DB.presencas = DB.presencas.filter(p=> !(p.data===dataStr && p.horario===horario) || state.presPendentes.has(p.aluno_id));
  const jaSalvos = new Set(DB.presencas.filter(p=>p.data===dataStr&&p.horario===horario).map(p=>p.aluno_id));
  state.presPendentes.forEach(id=>{
    if(!jaSalvos.has(id)){
      DB.presencas.push({id: DB.nextPresencaId++, aluno_id:id, data:dataStr, horario});
    }
  });
  saveDB();
  alert('Presenças salvas: '+state.presPendentes.size+' aluno(s).');
  render();
}

function renderProgresso(){
  let lista = DB.alunos.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  return `
  <div class="card">
    ${lista.length===0?`<div class="empty">Nenhum aluno cadastrado.</div>`:lista.map(a=>{
      const p = progressoAluno(a);
      const presDoAluno = DB.presencas.filter(x=>x.aluno_id===a.id).map(x=>x.data).sort().reverse();
      const ultima = presDoAluno[0];
      let streak = 0;
      if(presDoAluno.length){
        const datas = Array.from(new Set(presDoAluno)).map(parseISO);
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        const diffUlt = Math.floor((hoje-datas[0])/86400000);
        if(diffUlt<=1){
          let esperado = new Date(datas[0]);
          for(const dt of datas){
            if(dt.getTime()===esperado.getTime()){ streak++; esperado.setDate(esperado.getDate()-1); } else break;
          }
        }
      }
      return `<div class="list-item">
        <div class="avatar">${a.foto_url?`<img src="${a.foto_url}">`:getInitials(a.nome)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:14px;">${escapeHtml(a.nome)}</div>
          ${faixaHTML(a.graduacao,a.graus,a.graus_vermelhos,'sm')}
          <div class="row" style="margin-top:6px;flex-wrap:wrap;">
            <span class="badge">${p.total} presenças</span>
            <span class="badge ${p.desdeUltimo>=8?'badge-green':''}">${p.desdeUltimo}/8 p/ próximo grau</span>
            ${streak>1?`<span class="badge badge-blue">${streak} dias seguidos</span>`:''}
          </div>
          <div class="note" style="margin-top:4px;">Última presença: ${ultima?fmtBR(ultima):'—'}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderHistorico(){
  const lista = DB.promocoes.slice().sort((a,b)=> new Date(b.data_promocao)-new Date(a.data_promocao));
  return `<div class="card">
    ${lista.length===0?`<div class="empty">Nenhuma promoção registrada ainda.</div>`:lista.map(p=>{
      const aluno = DB.alunos.find(a=>a.id===p.aluno_id);
      const nome = aluno?aluno.nome:('Aluno #'+p.aluno_id);
      const data = new Date(p.data_promocao);
      const dataFmt = pad(data.getDate())+'/'+pad(data.getMonth()+1)+'/'+data.getFullYear();
      if(p.tipo==='graduacao'){
        return `<div class="promo-item"><div class="row"><span class="badge badge-blue">Faixa</span><span style="font-weight:600;font-size:13px;">${escapeHtml(nome)}</span></div>
        <div class="row" style="margin-top:6px;">${faixaHTML(p.graduacao_anterior,4,4,'sm')}<span>&#8594;</span>${faixaHTML(p.graduacao_nova,0,0,'sm')}</div>
        <div class="note" style="margin-top:4px;">${dataFmt}</div></div>`;
      }
      return `<div class="promo-item"><div class="row"><span class="badge badge-green">Grau</span><span style="font-weight:600;font-size:13px;">${escapeHtml(nome)}</span></div>
        <div class="row" style="margin-top:6px;">${faixaHTML(p.graduacao_nova,p.graus_novos,p.graus_vermelhos_novos,'sm')}</div>
        <div class="note" style="margin-top:4px;">${dataFmt}</div></div>`;
    }).join('')}
  </div>`;
}

function renderBackup(){
  return `
  <div class="card">
    <h2>Exportar</h2>
    <p class="note" style="margin-bottom:10px;">Baixa um arquivo .json com todos os alunos e presenças, para guardar ou levar para outro lugar.</p>
    <button class="btn btn-primary btn-block" onclick="exportarBackup()">Baixar backup</button>
  </div>
  <div class="card">
    <h2>Importar</h2>
    <p class="note" style="margin-bottom:10px;">Envia um arquivo .json exportado daqui. Alunos e presenças duplicados são ignorados.</p>
    <input type="file" accept="application/json" id="import-file" onchange="importarBackup(this.files[0])">
    ${state.backupMsg?`<p class="note" style="margin-top:8px;">${state.backupMsg}</p>`:''}
  </div>
  <div class="card">
    <p class="note">${DB.alunos.length} alunos, ${DB.presencas.length} presenças, ${DB.promocoes.length} promoções registradas nesta conta.</p>
  </div>
  `;
}
function exportarBackup(){
  const data = { version:'1.0', exported_at: new Date().toISOString(), alunos: DB.alunos, presencas: DB.presencas, promocoes: DB.promocoes };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jiu-presenca-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importarBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const body = JSON.parse(e.target.result);
      if(!body.alunos || !body.presencas){ state.backupMsg = 'Arquivo inválido.'; render(); return; }
      let alunosCount = 0, presCount = 0;
      const idMap = {};
      body.alunos.forEach(a=>{
        const existing = DB.alunos.find(x=>x.nome===a.nome && x.academia===a.academia);
        if(existing){ idMap[a.id] = existing.id; }
        else{
          const novo = { id: DB.nextAlunoId++, nome:a.nome, idade:a.idade||null, academia:a.academia, graduacao:a.graduacao||'branca', graus:a.graus||0, graus_vermelhos:a.graus_vermelhos||0, foto_url:null, data_nascimento:a.data_nascimento||null, presencas_na_ultima_promocao:a.presencas_na_ultima_promocao||0, created_at:a.created_at||new Date().toISOString(), updated_at:a.updated_at||new Date().toISOString() };
          DB.alunos.push(novo); idMap[a.id]=novo.id; alunosCount++;
        }
      });
      body.presencas.forEach(p=>{
        const alunoId = idMap[p.aluno_id] !== undefined ? idMap[p.aluno_id] : p.aluno_id;
        const existing = DB.presencas.find(x=>x.aluno_id===alunoId && x.data===p.data && x.horario===p.horario);
        if(!existing){ DB.presencas.push({id: DB.nextPresencaId++, aluno_id:alunoId, data:p.data, horario:p.horario}); presCount++; }
      });
      let promoCount = 0;
      (body.promocoes||[]).forEach(pr=>{
        const alunoId = idMap[pr.aluno_id] !== undefined ? idMap[pr.aluno_id] : pr.aluno_id;
        const existing = DB.promocoes.find(x=>x.aluno_id===alunoId && x.data_promocao===pr.data_promocao);
        if(!existing){ DB.promocoes.push(Object.assign({}, pr, {id: DB.nextPromocaoId++, aluno_id:alunoId})); promoCount++; }
      });
      saveDB();
      state.backupMsg = 'Importado: '+alunosCount+' aluno(s), '+presCount+' presença(s) e '+promoCount+' promoção(ões) novos.';
      render();
    }catch(err){ state.backupMsg = 'Erro ao ler o arquivo: '+err.message; render(); }
  };
  reader.readAsText(file);
}

function renderModal(){
  if(state.modal==='aluno-form') return renderAlunoForm();
  if(state.modal==='detalhes') return renderDetalhes();
  return '';
}
function fecharModal(){ state.modal=null; render(); }

function renderAlunoForm(){
  const editing = state.editingId!==null;
  const a = editing ? DB.alunos.find(x=>x.id===state.editingId) : null;
  const academias = getAcademias();
  return `<div class="modal-overlay" onclick="if(event.target===this) fecharModal();">
    <div class="modal">
      <div class="modal-head"><h2 style="margin:0;">${editing?'Editar aluno':'Novo aluno'}</h2><button class="btn-icon" onclick="fecharModal()">&#10005;</button></div>
      <div style="text-align:center;margin-bottom:14px;">
        <div class="avatar" style="width:72px;height:72px;font-size:22px;margin:0 auto 8px;">${state.fotoPreview?`<img src="${state.fotoPreview}">`:(a?getInitials(a.nome):'?')}</div>
        <input type="file" accept="image/*" id="foto-input" onchange="handleFotoUpload(this.files[0])">
      </div>
      <div class="field"><label>Nome</label><input type="text" id="f-nome" value="${a?escapeHtml(a.nome):''}"></div>
      <div class="grid2">
        <div class="field"><label>Academia</label>
          <select id="f-academia-select" onchange="toggleNovaAcademia()">${academias.map(x=>`<option value="${escapeHtml(x)}" ${a?(a.academia===x?'selected':''):(x===academias[0]?'selected':'')}>${escapeHtml(x)}</option>`).join('')}<option value="__nova__">+ Nova academia...</option></select>
          <input type="text" id="f-academia-nova" placeholder="Nome da nova academia" style="margin-top:6px;display:none;">
        </div>
        <div class="field"><label>Data de nascimento</label><input type="date" id="f-nascimento" value="${a&&a.data_nascimento?a.data_nascimento:''}"></div>
      </div>
      <div class="field"><label>Idade (se não souber a data)</label><input type="number" id="f-idade" value="${a&&a.idade?a.idade:''}"></div>
      <div class="field"><label>Graduação</label>
        <select id="f-graduacao">${FAIXAS.map(f=>`<option value="${f}" ${a&&a.graduacao===f?'selected':''}>${f.replace(/-/g,' ')}</option>`).join('')}</select>
      </div>
      <div class="grid2">
        <div class="field"><label>Graus brancos (0-4)</label><input type="number" id="f-graus" min="0" max="4" value="${a?a.graus:0}"></div>
        <div class="field"><label>Graus vermelhos (0-4)</label><input type="number" id="f-graus-v" min="0" max="4" value="${a?a.graus_vermelhos:0}"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="salvarAluno()">${editing?'Salvar alterações':'Adicionar aluno'}</button>
    </div>
  </div>`;
}
function handleFotoUpload(file){
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = function(e){
    img.onload = function(){
      const maxW = 200;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      state.fotoPreview = canvas.toDataURL('image/jpeg',0.7);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function toggleNovaAcademia(){
  const sel = document.getElementById('f-academia-select');
  const nova = document.getElementById('f-academia-nova');
  nova.style.display = sel.value==='__nova__' ? 'block' : 'none';
}
function salvarAluno(){
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome){ alert('Informe o nome do aluno.'); return; }
  const academiaSel = document.getElementById('f-academia-select').value;
  const academia = (academiaSel==='__nova__' ? document.getElementById('f-academia-nova').value.trim() : academiaSel) || 'Sem academia';
  const nascimento = document.getElementById('f-nascimento').value || null;
  const idadeInput = document.getElementById('f-idade').value;
  const graduacao = document.getElementById('f-graduacao').value;
  const graus = Math.max(0,Math.min(4, parseInt(document.getElementById('f-graus').value)||0));
  const grausV = Math.max(0,Math.min(4, parseInt(document.getElementById('f-graus-v').value)||0));

  const idadeAtual = nascimento ? calcIdade(nascimento) : (idadeInput?parseInt(idadeInput):null);
  if(idadeAtual && idadeAtual>15 && graduacao!=='branca' && FAIXAS.indexOf(graduacao) < FAIXAS.indexOf('azul-branca')){
    if(!confirm('Este aluno tem mais de 15 anos e a graduação escolhida é do sistema infantil. Continuar mesmo assim?')) return;
  }

  if(state.editingId!==null){
    const a = DB.alunos.find(x=>x.id===state.editingId);
    a.nome=nome; a.academia=academia; a.data_nascimento=nascimento; a.idade=idadeInput?parseInt(idadeInput):null;
    a.graduacao=graduacao; 
    if(graus===0 && grausV===0 && (a.graus!==0||a.graus_vermelhos!==0)){
      a.presencas_na_ultima_promocao = totalPresencasDe(a.id);
    }
    a.graus=graus; a.graus_vermelhos=grausV;
    if(state.fotoPreview) a.foto_url = state.fotoPreview;
    a.updated_at = new Date().toISOString();
  } else {
    DB.alunos.push({
      id: DB.nextAlunoId++, nome, idade: idadeInput?parseInt(idadeInput):null, academia, graduacao,
      graus, graus_vermelhos: grausV, foto_url: state.fotoPreview||null, data_nascimento: nascimento,
      presencas_na_ultima_promocao: 0, created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    });
  }
  saveDB();
  state.modal=null; state.editingId=null; state.fotoPreview=null;
  render();
}

function renderDetalhes(){
  const a = DB.alunos.find(x=>x.id===state.detalhesId);
  if(!a) return '';
  const p = progressoAluno(a);
  const presDoAluno = DB.presencas.filter(x=>x.aluno_id===a.id).sort((x,y)=>y.data.localeCompare(x.data)).slice(0,15);
  return `<div class="modal-overlay" onclick="if(event.target===this) fecharModal();">
    <div class="modal">
      <div class="modal-head"><h2 style="margin:0;">${escapeHtml(a.nome)}</h2><button class="btn-icon" onclick="fecharModal()">&#10005;</button></div>
      <div style="text-align:center;margin-bottom:12px;">
        <div class="avatar" style="width:72px;height:72px;font-size:22px;margin:0 auto 8px;">${a.foto_url?`<img src="${a.foto_url}">`:getInitials(a.nome)}</div>
        <div style="display:flex;justify-content:center;">${faixaHTML(a.graduacao,a.graus,a.graus_vermelhos,'md')}</div>
        <div class="note" style="margin-top:6px;text-transform:capitalize;">${a.graduacao.replace(/-/g,' ')} · ${a.academia}</div>
      </div>
      <div class="grid2" style="margin-bottom:14px;">
        <div class="stat"><div class="n">${p.total}</div><div class="l">Total de presenças</div></div>
        <div class="stat"><div class="n">${p.desdeUltimo}/8</div><div class="l">Desde o último grau</div></div>
      </div>
      <h2>Últimas presenças</h2>
      ${presDoAluno.length===0?`<div class="empty">Sem presenças registradas.</div>`:presDoAluno.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--border);"><span style="flex:1;">${fmtBR(x.data)}</span><span class="note">${x.horario}</span></div>`).join('')}
    </div>
  </div>`;
}

function bindDynamic(){}

loadDB().then(render).catch(function(err){
  console.error(err);
  document.getElementById('app').innerHTML =
    '<div style="padding:32px 20px;font-family:-apple-system,sans-serif;color:#0f172a;">'+
    '<h2 style="margin:0 0 8px;">Não consegui carregar o app</h2>'+
    '<p style="color:#64748b;font-size:14px;">'+ (err && err.message ? err.message : String(err)) +'</p>'+
    '<button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;">Tentar novamente</button>'+
    '</div>';
});
